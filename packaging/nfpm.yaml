# Debian and RPM packages from the tree packaging/build-release.sh stages.
# nfpm expands ${VERSION} from the environment; run it from the repository root.
name: hydroxl
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: admin
priority: optional
maintainer: Hydroxl <noreply@github.com>
description: |
  A quiet, native QEMU/KVM workspace for Linux.
  Bundles a Neptune-enabled QEMU for DirectX in Windows guests.
vendor: Hydroxl
homepage: https://github.com/sherlockholmese/hydroxl
license: MIT and Apache-2.0 and OFL-1.1 and GPL-2.0-only and LGPL-2.1-or-later

# Listed by path so the package never claims system directories like /usr/bin.
contents:
  - src: target/stage/usr/bin/hydroxl
    dst: /usr/bin/hydroxl
  - src: target/stage/usr/lib/hydroxl
    dst: /usr/lib/hydroxl
    type: tree
  - src: target/stage/usr/share/applications/dev.hydroxl.Hydroxl.desktop
    dst: /usr/share/applications/dev.hydroxl.Hydroxl.desktop
  - src: target/stage/usr/share/icons/hicolor/scalable/apps/dev.hydroxl.Hydroxl.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.hydroxl.Hydroxl.svg
  - src: target/stage/usr/share/licenses/hydroxl
    dst: /usr/share/licenses/hydroxl
    type: tree
  - src: target/stage/usr/share/qemu/firmware/*-hydroxl-*.json
    dst: /usr/share/qemu/firmware/

overrides:
  deb:
    depends:
      - libvirt-daemon-system
      - libvirt-clients
      - qemu-system-x86
      - libspice-client-glib-2.0-8
      - swtpm
      - virtinst
      - libvulkan1
      - mesa-vulkan-drivers | vulkan-icd
      - libegl1
      - libepoxy0
      - libgbm1
      - libdrm2
      - libpixman-1-0
      - libglib2.0-0t64 | libglib2.0-0
      - libslirp0
      - libspice-server1
      - libusbredirparser1t64 | libusbredirparser1
      - libusb-1.0-0
      - libudev1
      - libcap-ng0
      - libattr1
      - libasound2t64 | libasound2
      - libpulse0
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libseccomp2
      - libpng16-16t64 | libpng16-16
      - libgnutls30t64 | libgnutls30
      - libzstd1
      - liblzo2-2
      - libaio1t64 | libaio1
      - liburing2
      - libnuma1
      - libcurl3t64-gnutls | libcurl3-gnutls
      - libfdt1
      - libxkbcommon-x11-0
      - libwayland-client0
      - libfontconfig1
      - xdg-desktop-portal
      - zenity
    recommends:
      - dnsmasq-base
      - passt
      - qemu-system-arm
      - xterm
  rpm:
    depends:
      - libvirt-daemon-kvm
      - libvirt-client
      - qemu-system-x86-core
      - spice-glib
      - swtpm
      - virt-install
      - vulkan-loader
      - mesa-vulkan-drivers
      - mesa-libEGL
      - mesa-libgbm
      - libepoxy
      - libdrm
      - pixman
      - glib2
      - libslirp
      - spice-server
      - usbredir
      - libusb1
      - systemd-libs
      - libcap-ng
      - libattr
      - alsa-lib
      - pulseaudio-libs
      - pipewire-libs
      - libseccomp
      - libpng
      - gnutls
      - libzstd
      - lzo
      - libaio
      - liburing
      - numactl-libs
      - libcurl
      - libfdt
      - libxkbcommon-x11
      - libwayland-client
      - fontconfig
      - xdg-desktop-portal
      - zenity
    recommends:
      - dnsmasq
      - passt
      - qemu-system-aarch64-core
      - xterm
